</svg></g>
<text x="1416" y="314" fill="#eee9df" font-family="Noto Sans" font-size="24" font-weight="500" text-anchor="middle">Steins;OS</text>
<text x="1416" y="350" fill="#a9b6bf" font-family="Noto Sans" font-size="12" font-weight="400" text-anchor="middle">Preparing the login screen</text>
<text x="1272" y="442" fill="#eee9df" font-family="Noto Sans" font-size="21" font-weight="600" text-anchor="start">05 / Handoff</text>
<text x="1272" y="474" fill="#efad60" font-family="DejaVu Sans Mono" font-size="14" font-weight="400" text-anchor="start">940–1,100 ms</text>
<text x="1272" y="508" fill="#a9b6bf" font-family="Noto Sans" font-size="13" font-weight="400" text-anchor="start">Continue only when login is ready.</text>
<text x="1272" y="532" fill="#a9b6bf" font-family="Noto Sans" font-size="13" font-weight="400" text-anchor="start">Do not delay authentication.</text>
