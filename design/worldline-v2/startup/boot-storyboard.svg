<text x="802" y="380" fill="#a9b6bf" font-family="Noto Sans" font-size="9" font-weight="400" text-anchor="middle">THEME CALIBRATION</text>
<text x="658" y="442" fill="#eee9df" font-family="Noto Sans" font-size="21" font-weight="600" text-anchor="start">03 / Calibrate</text>
<text x="658" y="474" fill="#efad60" font-family="DejaVu Sans Mono" font-size="14" font-weight="400" text-anchor="start">480–720 ms</text>
<text x="658" y="508" fill="#a9b6bf" font-family="Noto Sans" font-size="13" font-weight="400" text-anchor="start">Brief public theme digits.</text>
<text x="658" y="532" fill="#a9b6bf" font-family="Noto Sans" font-size="13" font-weight="400" text-anchor="start">Never personal pre-login state.</text>
