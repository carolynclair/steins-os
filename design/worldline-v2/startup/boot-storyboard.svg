<text x="965" y="442" fill="#eee9df" font-family="Noto Sans" font-size="21" font-weight="600" text-anchor="start">04 / Settle</text>
<text x="965" y="474" fill="#efad60" font-family="DejaVu Sans Mono" font-size="14" font-weight="400" text-anchor="start">720–940 ms</text>
<text x="965" y="508" fill="#a9b6bf" font-family="Noto Sans" font-size="13" font-weight="400" text-anchor="start">The mark stabilises.</text>
<text x="965" y="532" fill="#a9b6bf" font-family="Noto Sans" font-size="13" font-weight="400" text-anchor="start">Temporary traces recede.</text>
