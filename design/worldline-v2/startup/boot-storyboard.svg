<text x="351" y="442" fill="#eee9df" font-family="Noto Sans" font-size="21" font-weight="600" text-anchor="start">02 / Assemble</text>
<text x="351" y="474" fill="#efad60" font-family="DejaVu Sans Mono" font-size="14" font-weight="400" text-anchor="start">120–480 ms</text>
<text x="351" y="508" fill="#a9b6bf" font-family="Noto Sans" font-size="13" font-weight="400" text-anchor="start">Light resolves into the current mark.</text>
<text x="351" y="532" fill="#a9b6bf" font-family="Noto Sans" font-size="13" font-weight="400" text-anchor="start">No logo replacement.</text>
