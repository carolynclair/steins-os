<text x="1723" y="354" fill="#101820" font-family="Noto Sans" font-size="12" font-weight="600" text-anchor="middle">Sign in</text>
<text x="1579" y="442" fill="#eee9df" font-family="Noto Sans" font-size="21" font-weight="600" text-anchor="start">06 / Authenticate</text>
<text x="1579" y="474" fill="#efad60" font-family="DejaVu Sans Mono" font-size="14" font-weight="400" text-anchor="start">Readiness-driven</text>
<text x="1579" y="508" fill="#a9b6bf" font-family="Noto Sans" font-size="13" font-weight="400" text-anchor="start">Greeter controls stay practical.</text>
<text x="1579" y="532" fill="#a9b6bf" font-family="Noto Sans" font-size="13" font-weight="400" text-anchor="start">Cue belongs after login, if enabled.</text>
<path d="M44 622H1876" stroke="#435767"/>
<rect x="44" y="661" width="594" height="164" rx="10" fill="#151f28" stroke="#435767"/>
<text x="66" y="697" fill="#efad60" font-family="Noto Sans" font-size="12" font-weight="600" text-anchor="start">FULL</text>
<text x="66" y="735" fill="#eee9df" font-family="Noto Sans" font-size="25" font-weight="600" text-anchor="start">≤1,200 ms preview</text>
<text x="66" y="772" fill="#a9b6bf" font-family="Noto Sans" font-size="14" font-weight="400" text-anchor="start">One assembly; no mandatory waiting.</text>
<text x="66" y="799" fill="#a9b6bf" font-family="Noto Sans" font-size="14" font-weight="400" text-anchor="start">Native port remains unimplemented.</text>
<rect x="664" y="661" width="594" height="164" rx="10" fill="#151f28" stroke="#435767"/>
<text x="686" y="697" fill="#efad60" font-family="Noto Sans" font-size="12" font-weight="600" text-anchor="start">REDUCED</text>
<text x="686" y="735" fill="#eee9df" font-family="Noto Sans" font-size="25" font-weight="600" text-anchor="start">150 ms or static</text>
<text x="686" y="772" fill="#a9b6bf" font-family="Noto Sans" font-size="14" font-weight="400" text-anchor="start">No trace travel, scanning or digit roll.</text>
<text x="686" y="799" fill="#a9b6bf" font-family="Noto Sans" font-size="14" font-weight="400" text-anchor="start">Authentication remains usable.</text>
<rect x="1284" y="661" width="594" height="164" rx="10" fill="#151f28" stroke="#435767"/>
<text x="1306" y="697" fill="#efad60" font-family="Noto Sans" font-size="12" font-weight="600" text-anchor="start">OFF / SILENT</text>
<text x="1306" y="735" fill="#eee9df" font-family="Noto Sans" font-size="25" font-weight="600" text-anchor="start">Immediate when ready</text>
<text x="1306" y="772" fill="#a9b6bf" font-family="Noto Sans" font-size="14" font-weight="400" text-anchor="start">Static mark and real status messages.</text>
<text x="1306" y="799" fill="#a9b6bf" font-family="Noto Sans" font-size="14" font-weight="400" text-anchor="start">No audio prerequisite for startup.</text>
<text x="44" y="886" fill="#eee9df" font-family="Noto Sans" font-size="23" font-weight="600" text-anchor="start">Integration boundaries</text>
<text x="44" y="923" fill="#a9b6bf" font-family="Noto Sans" font-size="15" font-weight="400" text-anchor="start">Plymouth: early boot/status/passwords  →  SDDM: authentication  →  user session: worldline state and optional readiness cue</text>
<text x="44" y="961" fill="#a9b6bf" font-family="Noto Sans" font-size="15" font-weight="400" text-anchor="start">No initramfs audio service. No user-home or session-bus reads before authentication. No screenshot-matched success claim.</text>
<rect x="0" y="1014" width="1920" height="66" fill="#0b1218"/>
<text x="44" y="1043" fill="#eee9df" font-family="Noto Sans" font-size="14" font-weight="600" text-anchor="start">DESIGN PREVIEW / NOT A PLYMOUTH CAPTURE</text>
<text x="44" y="1066" fill="#a9b6bf" font-family="Noto Sans" font-size="12" font-weight="400" text-anchor="start">V2 startup direction · current emblem unchanged · cinematic timing is a proposal, not measured boot performance</text>
</svg>
